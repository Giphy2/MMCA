<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mukele Moni Law</title>
    <script>
      // GitHub Pages SPA fallback: capture the intended path, redirect to index.html
      // which restores the URL and lets the client-side router handle it.
      (function () {
        var basePath = window.location.pathname
          .split('/')
          .slice(0, -1)
          .join('/');
        sessionStorage.redirect = window.location.href;
        window.location.replace(basePath + '/');
      })();
    </script>
  </head>
  <body>
    Redirecting…
  </body>
</html>
