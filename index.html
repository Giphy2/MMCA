    <script>
      // SPA redirect fallback: GitHub Pages serves 404.html for unknown paths.
      // 404.html redirects here with the original path in the query string.
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState({}, '', redirect);
        }
      })();
    </script>
